<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>No internet connection</title>
    <!-- Shown by the service worker when a page cannot be fetched. Everything
         is inline: there is no network to load a stylesheet or font from. -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
            background: #ffffff;
            color: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .box { max-width: 320px; }
        .icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #f2f2f2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg { width: 52px; height: 52px; fill: #8f8f8f; }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 15px; color: #8f8f8f; line-height: 1.5; margin-bottom: 24px; }
        button {
            appearance: none;
            border: 0;
            border-radius: 10px;
            background: #1f1f1f;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 28px;
            cursor: pointer;
        }
        button:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/>
            </svg>
        </div>
        <h1>इन्टरनेट जडान छैन</h1>
        <p>No internet connection. Please check your network and try again.</p>
        <button type="button" onclick="location.reload()">पुनः प्रयास गर्नुहोस्</button>
    </div>
    <script>
        // Come back on our own as soon as the connection returns.
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
